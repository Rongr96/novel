<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的书房 · 小说集</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Georgia','宋体',serif; }
body { background: #f7f3eb; min-height: 100vh; color: #2f241b; padding: 0.8rem; }
.container { max-width: 900px; margin: 0 auto; }

.gate { position: fixed; inset: 0; z-index: 9999; background: #f7f3eb; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.gate-box { max-width: 360px; width: 100%; background: #fefcf9; border: 1px solid #e9dbce; border-radius: 1rem; padding: 1.5rem; text-align: center; }
.gate-box .icon { font-size: 2.5rem; margin-bottom: 0.8rem; }
.gate-box h2 { font-weight: 400; color: #3f2e22; letter-spacing: 2px; margin-bottom: 0.4rem; font-size:1.3rem; }
.gate-box p { color: #8b7a6b; font-size: 0.85rem; font-style: italic; margin-bottom: 1.2rem; }
.gate-box input { width: 100%; padding: 0.7rem 0.9rem; border: 1px solid #d6c7b8; border-radius: 60px; font-size: 0.95rem; background: #fffcf9; outline: none; text-align: center; letter-spacing: 2px; color: #2f241b; margin-bottom: 0.8rem; font-family: inherit; }
.gate-box button { width: 100%; padding: 0.7rem 0; background: #5e4b3c; color: #fff; border: none; border-radius: 60px; font-size: 0.95rem; letter-spacing: 2px; cursor: pointer; font-family: inherit; }
.gate-error { color: #b35e5e; font-size: 0.8rem; margin-top: 0.4rem; min-height: 1rem; font-style: italic; }

.site-header { text-align: center; margin-bottom: 1.2rem; padding-bottom: 1rem; border-bottom: 1px solid #e0d3c6; }
.site-header h1 { font-size: 1.6rem; font-weight: 400; color: #3f2e22; letter-spacing: 3px; margin-bottom: 0.2rem; }
.site-header p { color: #9b8a7a; font-style: italic; font-size: 0.8rem; }

.recent-section { margin-bottom: 1rem; }
.recent-title { font-size: 0.9rem; color: #6b5a4b; font-weight: 400; margin-bottom: 0.5rem; letter-spacing: 1px; }
.recent-list { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.3rem; }
.recent-card { flex: 0 0 auto; min-width: 140px; background: #fefcf9; border: 1px solid #e9dbce; border-radius: 0.7rem; padding: 0.6rem 0.9rem; cursor: pointer; }
.recent-card .r-title { font-size: 0.9rem; color: #3f2e22; margin-bottom: 0.2rem; }
.recent-card .r-meta { font-size: 0.75rem; color: #9b8a7a; font-style: italic; }

.search-box { max-width: 100%; margin: 0 auto 1rem; position: relative; }
.search-box input { width: 100%; padding: 0.7rem 1rem 0.7rem 2.4rem; border: 1px solid #d6c7b8; border-radius: 60px; font-size: 0.9rem; background: #fffcf9; outline: none; color: #2f241b; }
.search-box::before { content: "🔍"; position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); font-size: 0.9rem; opacity: 0.5; }

.book-card { background: #fefcf9; border: 1px solid #e9dbce; border-radius: 0.8rem; padding: 1rem 1.1rem; margin-bottom: 0.8rem; }
.book-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 0.5rem; }
.book-title { font-size: 1.15rem; font-weight: 400; color: #3f2e22; letter-spacing: 1px; border-left: 3px solid #b09b89; padding-left: 0.6rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.book-toggle { font-size: 0.8rem; color: #8b7a6b; background: #f3ece3; padding: 0.25rem 0.6rem; border-radius: 40px; white-space: nowrap; }
.book-meta { color: #9b8a7a; font-size: 0.8rem; font-style: italic; padding-left: 0.9rem; margin-top: 0.4rem; }
.book-desc { color: #5a4a3e; font-size: 0.85rem; line-height: 1.6; padding-left: 0.9rem; margin-top: 0.4rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.book-footer { display: flex; justify-content: space-between; align-items: center; padding-left: 0.9rem; margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px dashed #e9dbce; }
.book-category { background: #efe6dd; color: #6b5a4b; font-size: 0.75rem; padding: 0.15rem 0.7rem; border-radius: 40px; }
.book-status-done { background: #d7ebd7; color: #3a7a3a; font-size: 0.72rem; padding: 0.15rem 0.6rem; border-radius: 40px; margin-left: 0.3rem; }
.book-status-ongoing { background: #f3e2c7; color: #8a6b2e; font-size: 0.72rem; padding: 0.15rem 0.6rem; border-radius: 40px; margin-left: 0.3rem; }
.book-count { color: #9b8a7a; font-size: 0.8rem; }

.chapter-list-expanded { margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid #e9dbce; }
.chapter-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.6rem; border-radius: 0.4rem; cursor: pointer; font-size: 0.88rem; color: #5a4a3e; }
.chapter-row:hover { background: #f3ece3; }
.chapter-row .ch-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chapter-row .ch-time { font-size: 0.75rem; color: #9b8a7a; margin-left: 0.5rem; white-space:nowrap; }

.empty-state { text-align: center; padding: 3rem 1rem; color: #b7a89b; font-style: italic; font-size:0.9rem; }
.empty-state .icon { font-size: 3rem; margin-bottom: 0.8rem; opacity: 0.5; }
.site-footer { text-align: center; color: #b7a89b; font-size: 0.75rem; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e9dbce; letter-spacing: 1px; }
</style>
</head>
<body>

<div id="gate" class="gate">
    <div class="gate-box">
        <div class="icon">🔒</div>
        <h2>私人书房</h2>
        <p>请输入阅读密码</p>
        <input type="password" id="gatePwd" placeholder="········" autocomplete="off">
        <button id="gateBtn">进入书房</button>
        <div id="gateError" class="gate-error"></div>
        <div style="font-size:0.75rem; color:#b7a89b; margin-top:1rem; font-style:italic;">
            密码获取添加 QQ：1550930440
        </div>
    </div>
</div>

<div class="container" id="mainContent" style="display:none;">
    <header class="site-header">
        <h1>✎ 我的书房</h1>
        <p>—— 那些藏在字里行间的故事 ——</p>
    </header>

    <div id="recentSection" class="recent-section" style="display:none;">
        <div class="recent-title">📖 最近阅读</div>
        <div id="recentList" class="recent-list"></div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索书名、作者、简介或章节内容..." autocomplete="off">
    </div>

    <div id="bookGrid"></div>
    <div id="emptyState" class="empty-state" style="display:none;">
        <div class="icon">📚</div>
        <p>还没有书，或者没有匹配的结果</p>
    </div>

    <footer class="site-footer">—— 只属于你的故事 ——</footer>
</div>

<script>
// ============================================================
// 读者首页：读 books.json + 每本书的 _meta.json
// ============================================================

let READER_PASSWORD = "123456";
const PASS_KEY = "novel_pass_ok";
const PASS_TTL = 24 * 60 * 60 * 1000;
const HISTORY_KEY = "novel_read_history";

let allBooks = [];
let bookMetaCache = {};  // 缓存每本书的 meta
let expandedBooks = {};

function hasPass() {
    try {
        const raw = localStorage.getItem(PASS_KEY);
        if (!raw) return false;
        const obj = JSON.parse(raw);
        if (Date.now() - obj.t > PASS_TTL) return false;
        return true;
    } catch(e) { return false; }
}
function setPass() { localStorage.setItem(PASS_KEY, JSON.stringify({ t: Date.now() })); }
function getHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}'); } catch(e) { return {}; }
}

window.addEventListener('DOMContentLoaded', async function() {
    try {
        const res = await fetch('books.json?t=' + Date.now());
        if (res.ok) {
            const data = await res.json();
            if (data.settings && data.settings.readerPassword) {
                READER_PASSWORD = data.settings.readerPassword;
            }
        }
    } catch(e) {}
    if (hasPass()) showContent();
    else document.getElementById('gatePwd').focus();
});

document.getElementById('gateBtn').onclick = function() {
    const pwd = document.getElementById('gatePwd').value.trim();
    if (pwd === READER_PASSWORD) {
        setPass();
        showContent();
    } else {
        document.getElementById('gateError').textContent = '密码不正确，请重试。';
        document.getElementById('gatePwd').value = '';
        document.getElementById('gatePwd').focus();
    }
};
document.getElementById('gatePwd').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('gateBtn').click(); }
});

function showContent() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    loadBooks();
}

async function loadBooks() {
    try {
        const res = await fetch('books.json?t=' + Date.now());
        if (!res.ok) throw new Error();
        const data = await res.json();
        allBooks = data.books || [];
    } catch (err) { allBooks = []; }

    // 并行读取每本书的 meta
    await Promise.all(allBooks.map(async (book) => {
        if (!book.metaFile) { bookMetaCache[book.id] = { chapters: [] }; return; }
        try {
            // 读 meta
            const res = await fetch(book.metaFile + '?t=' + Date.now());
            if (!res.ok) { bookMetaCache[book.id] = { chapters: [] }; return; }
            const meta = await res.json();
            const parts = meta.parts || [];
            // 读所有 part 拿章节
            const allChapters = [];
            await Promise.all(parts.map(async (p) => {
                try {
                    const r = await fetch(p.file + '?t=' + Date.now());
                    if (r.ok) {
                        const d = await r.json();
                        (d.chapters || []).forEach(ch => allChapters.push(ch));
                    }
                } catch(e) {}
            }));
            bookMetaCache[book.id] = { chapters: allChapters };
        } catch(e) {
            bookMetaCache[book.id] = { chapters: [] };
        }
    }));

    renderBooks(allBooks);
    renderRecent();
}

function getVisibleChapters(bookId) {
    const now = new Date();
    return (bookMetaCache[bookId]?.chapters || []).filter(ch => {
        if (!ch.isScheduled) return true;
        return new Date(ch.publishTime) <= now;
    });
}

function renderRecent() {
    const history = getHistory();
    const section = document.getElementById('recentSection');
    const list = document.getElementById('recentList');
    const items = Object.values(history).filter(h => h && h.bookId).sort((a, b) => b.t - a.t).slice(0, 5);
    if (items.length === 0) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    list.innerHTML = items.map(h => {
        const book = allBooks.find(b => b.id === h.bookId);
        if (!book) return '';
        return `
            <div class="recent-card" onclick="continueRead('${book.id}', ${h.chapterIndex || 0})">
                <div class="r-title">${escapeHtml(book.title || '无题')}</div>
                <div class="r-meta">读到 第${(h.chapterIndex || 0) + 1}章</div>
            </div>
        `;
    }).join('');
}

function continueRead(bookId, chapterIndex) {
    window.location.href = 'read.html?book=' + bookId + '&ch=' + chapterIndex;
}

function renderBooks(books) {
    const grid = document.getElementById('bookGrid');
    const empty = document.getElementById('emptyState');
    if (!books || books.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    grid.innerHTML = books.map(book => {
        const chapters = getVisibleChapters(book.id);
        const count = chapters.length;
        const isOpen = expandedBooks[book.id];

        let expandedHtml = '';
        if (isOpen) {
            if (chapters.length === 0) {
                expandedHtml = '<div class="chapter-list-expanded"><div style="text-align:center;color:#b7a89b;font-style:italic;padding:1rem;">本书暂无章节</div></div>';
            } else {
                expandedHtml = `
                    <div class="chapter-list-expanded">
                        ${chapters.map((ch, i) => `
                            <div class="chapter-row" onclick="event.stopPropagation(); openChapter('${book.id}', ${i})">
                                <span class="ch-title">${escapeHtml(ch.title || ('第' + (i+1) + '章'))}</span>
                                <span class="ch-time">${escapeHtml((ch.publishTime || '').slice(0, 10))}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        const statusHtml = book.status === '已完结'
            ? '<span class="book-status-done">✅ 已完结</span>'
            : '<span class="book-status-ongoing">📝 连载中</span>';

        return `
            <div class="book-card">
                <div class="book-header" onclick="toggleBook('${book.id}')">
                    <div class="book-title">${escapeHtml(book.title || '无题')}</div>
                    <div class="book-toggle">${isOpen ? '收起目录 ▲' : '展开目录 ▼'}</div>
                </div>
                <div class="book-meta"><span>✍️ ${escapeHtml(book.author || '未署名')}</span></div>
                <div class="book-desc">${escapeHtml(book.description || '暂无简介')}</div>
                <div class="book-footer">
                    <span class="book-category">${escapeHtml(book.category || '未分类')}</span>
                    ${statusHtml}
                    <span class="book-count">📖 ${count} 章</span>
                </div>
                ${expandedHtml}
            </div>
        `;
    }).join('');
}

window.toggleBook = function(bookId) {
    expandedBooks[bookId] = !expandedBooks[bookId];
    renderBooks(allBooks);
};

window.openChapter = function(bookId, chapterIndex) {
    window.location.href = 'read.html?book=' + bookId + '&ch=' + chapterIndex;
};

document.getElementById('searchInput').addEventListener('input', function(e) {
    const kw = e.target.value.trim().toLowerCase();
    if (!kw) { renderBooks(allBooks); return; }
    const filtered = allBooks.filter(book => {
        const inMeta = (book.title||'').toLowerCase().includes(kw)
                    || (book.author||'').toLowerCase().includes(kw)
                    || (book.description||'').toLowerCase().includes(kw);
        const inChapters = (bookMetaCache[book.id]?.chapters || []).some(ch =>
            (ch.title||'').toLowerCase().includes(kw)
            || (ch.content||'').toLowerCase().includes(kw));
        return inMeta || inChapters;
    });
    renderBooks(filtered);
});

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
}
</script>
</body>
</html>
