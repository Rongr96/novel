<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创作管理后台 · 我的书房</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Georgia','宋体',serif; }
body { background:#f7f3eb; min-height:100vh; color:#2f241b; padding:1.5rem; }
.container { max-width:1200px; margin:0 auto; }

.top-bar {
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:1rem; margin-bottom:1.5rem;
    border-bottom:2px solid #e0d3c6; flex-wrap:wrap; gap:0.8rem;
}
.top-bar h1 { font-size:1.6rem; font-weight:400; letter-spacing:2px; color:#3f2e22; }
.top-actions { display:flex; gap:0.6rem; flex-wrap:wrap; }

.btn {
    background:#efe6dd; color:#5e4b3c; border:none;
    padding:0.6rem 1.2rem; border-radius:40px; cursor:pointer;
    font-size:0.9rem; font-family:inherit; transition:background 0.2s;
    display:inline-flex; align-items:center; gap:0.4rem;
}
.btn:hover { background:#e0d3c6; }
.btn-primary { background:#5e4b3c; color:#fff; }
.btn-primary:hover { background:#4a3a2e; }
.btn-danger { background:#c97a7a; color:#fff; }
.btn-danger:hover { background:#b35e5e; }
.btn-small { padding:0.4rem 0.9rem; font-size:0.85rem; }

.login-box {
    max-width:420px; margin:3rem auto; background:#fefcf9;
    border:1px solid #e9dbce; border-radius:1.5rem;
    padding:2rem; box-shadow:0 8px 24px rgba(0,0,0,0.04);
}
.login-box h2 { font-weight:400; text-align:center; margin-bottom:1.5rem; color:#3f2e22; letter-spacing:2px; }
.login-box label { display:block; font-size:0.85rem; color:#8b7a6b; margin-bottom:0.4rem; }
.login-box input {
    width:100%; padding:0.8rem 1rem; border:1px solid #d6c7b8;
    border-radius:0.6rem; font-size:0.95rem; background:#fffcf9;
    outline:none; font-family:inherit; margin-bottom:1rem; color:#2f241b;
}
.login-box .tip { font-size:0.8rem; color:#b7a89b; margin-top:0.5rem; text-align:center; }

.main-area { display:none; }

.tabs {
    display:flex; gap:0.3rem; flex-wrap:wrap;
    margin-bottom:1.5rem; border-bottom:1px solid #e9dbce; padding-bottom:0.5rem;
}
.tab {
    padding:0.6rem 1.2rem; border-radius:0.6rem 0.6rem 0 0;
    background:transparent; color:#8b7a6b; border:none;
    cursor:pointer; font-size:0.95rem; font-family:inherit;
    transition:background 0.15s;
}
.tab:hover { background:#f3ece3; }
.tab.active { background:#5e4b3c; color:#fff; }

.panel { display:none; }
.panel.active { display:block; }

.card {
    background:#fefcf9; border:1px solid #e9dbce;
    border-radius:1rem; padding:1.5rem; margin-bottom:1.2rem;
}
.card h3 { font-weight:400; margin-bottom:1rem; color:#3f2e22; letter-spacing:1px; }

.form-row { display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1rem; }
.form-group { flex:1; min-width:200px; }
.form-group label { display:block; font-size:0.85rem; color:#8b7a6b; margin-bottom:0.4rem; }
.form-group input, .form-group select, .form-group textarea {
    width:100%; padding:0.7rem 0.9rem; border:1px solid #d6c7b8;
    border-radius:0.6rem; font-size:0.95rem; background:#fffcf9;
    outline:none; font-family:inherit; color:#2f241b;
}
.form-group textarea { min-height:120px; resize:vertical; line-height:1.7; }

.toolbar {
    display:flex; gap:0.4rem; flex-wrap:wrap;
    margin-bottom:0.6rem; padding:0.6rem;
    background:#f3ece3; border-radius:0.6rem;
}
.toolbar button {
    background:#fffcf9; border:1px solid #d6c7b8; color:#5e4b3c;
    padding:0.35rem 0.8rem; border-radius:0.5rem;
    cursor:pointer; font-size:0.85rem; font-family:inherit;
}
.toolbar button:hover { background:#e0d3c6; }

.item-list { display:flex; flex-direction:column; gap:0.6rem; }
.item {
    background:#fefcf9; border:1px solid #e9dbce;
    border-radius:0.8rem; padding:0.9rem 1.2rem;
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:0.6rem;
}
.item-info { flex:1; min-width:200px; }
.item-title { color:#3f2e22; font-size:1rem; }
.item-meta { font-size:0.8rem; color:#9b8a7a; margin-top:0.2rem; font-style:italic; }
.item-actions { display:flex; gap:0.4rem; flex-wrap:wrap; }

.badge {
    display:inline-block; font-size:0.75rem;
    padding:0.15rem 0.6rem; border-radius:40px; margin-left:0.4rem;
}
.badge-live { background:#d7ebd7; color:#3a7a3a; }
.badge-scheduled { background:#f3e2c7; color:#8a6b2e; }

.picker-btn {
    width:100%; padding:0.7rem 0.9rem; border:1px solid #d6c7b8;
    border-radius:0.6rem; font-size:0.95rem; background:#fffcf9;
    color:#2f241b; cursor:pointer; text-align:left;
    display:flex; justify-content:space-between; align-items:center;
    font-family:inherit;
}
.picker-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.4); z-index:2000;
    align-items:center; justify-content:center; padding:1.5rem;
}
.picker-overlay.open { display:flex; }
.picker-box {
    background:#fefcf9; border:1px solid #e9dbce;
    border-radius:1rem; padding:1.2rem;
    max-width:400px; width:100%; max-height:70vh;
    overflow-y:auto;
}
.picker-box h4 { font-weight:400; color:#3f2e22; margin-bottom:0.8rem; text-align:center; }
.picker-option {
    padding:0.8rem 1rem; border-radius:0.6rem; cursor:pointer;
    color:#5a4a3e; margin-bottom:0.3rem; border:1px solid #e9dbce;
}
.picker-option:hover { background:#f3ece3; }
.picker-option.selected { background:#5e4b3c; color:#fff; }
.picker-cancel {
    width:100%; padding:0.7rem; margin-top:0.5rem;
    background:transparent; border:1px solid #d6c7b8;
    border-radius:0.6rem; color:#8b7a6b; cursor:pointer; font-family:inherit;
}

.cat-btn-group { display:flex; gap:0.6rem; flex-wrap:wrap; }
.cat-btn {
    padding:0.7rem 1.5rem; border:1px solid #d6c7b8;
    background:#fffcf9; color:#5e4b3c;
    border-radius:0.6rem; cursor:pointer;
    font-family:inherit; font-size:0.95rem;
}
.cat-btn.selected { background:#5e4b3c; color:#fff; }

.toast {
    position:fixed; top:1.5rem; left:50%; transform:translateX(-50%);
    background:#5e4b3c; color:#fff; padding:0.9rem 1.6rem;
    border-radius:40px; font-size:0.95rem; z-index:9999;
    opacity:0; transition:opacity 0.3s, transform 0.3s;
    pointer-events:none;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0.3rem); }
.toast.error { background:#b35e5e; }

.empty { text-align:center; padding:2.5rem 1rem; color:#b7a89b; font-style:italic; }

@media (max-width:600px) {
    body { padding:0.8rem; }
    .top-bar h1 { font-size:1.2rem; }
    .tab { padding:0.4rem 0.7rem; font-size:0.8rem; }
    .card { padding:0.9rem; }
}
</style>
</head>
<body>
<div class="container">

    <div class="top-bar">
        <h1>⚙️ 创作管理后台</h1>
        <div class="top-actions">
            <a href="index.html" class="btn" target="_blank">👁 预览读者页</a>

            <div class="card">

    <label>章节类型</label>

<script>
// ============================================================
// 新版管理后台：每 50 章自动分文件
// 结构：book_xxx_meta.json + book_xxx_part1.json + part2.json ...
// ============================================================

const REPO = 'Rongr96/novel';
const CHAPTERS_PER_FILE = 50;  // 每 50 章一个文件

let state = {
    token: '',
    books: [],
    settings: { readerPassword: '123456', adminPassword: 'admin' },
    booksSha: '',
    shaCache: {}  // 记录所有文件的 sha
};

function $(id){ return document.getElementById(id); }

function toast(msg, isError) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('error', !!isError);
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
}

function toLocalInput(d) {
    const date = new Date(d);
    const pad = n => String(n).padStart(2, '0');
    return date.getFullYear() + '-' + pad(date.getMonth()+1) + '-' + pad(date.getDate())
        + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
}

function uid(prefix) {
    return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

// ========== GitHub API ==========
async function ghGet(path) {
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?t=${Date.now()}`, {
        headers: { 'Authorization': 'token ' + state.token }
    });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const content = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ''))));
    return { data: JSON.parse(content), sha: json.sha };
}

async function ghPut(path, dataObj, sha, commitMsg) {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(dataObj, null, 2))));
    const body = { message: commitMsg || '更新 ' + path, content: content };
    if (sha) body.sha = sha;
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
        method: 'PUT',
        headers: {
            'Authorization': 'token ' + state.token,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || ('HTTP ' + res.status));
    }
    const json = await res.json();
    return json.content.sha;
}

async function saveWithRetry(path, dataObj, sha, commitMsg, maxRetry = 3) {
    let lastErr;
    for (let i = 0; i < maxRetry; i++) {
        try {
            return await ghPut(path, dataObj, sha, commitMsg);
        } catch (e) {
            lastErr = e;
            if (i < maxRetry - 1) await new Promise(r => setTimeout(r, 2000));
        }
    }
    throw lastErr;
}

// ========== 登录 ==========
$('loginBtn').onclick = async function() {
    const pwd = $('adminPwd').value.trim();
    const token = $('tokenInput').value.trim();
    if (!pwd) return toast('请输入管理员密码', true);
    if (!token) return toast('请输入 GitHub Token', true);

    state.token = token;

    try {
        const result = await ghGet('books.json');
        if (!result) {
            // books.json 不存在，初始化
            state.books = [];
            state.settings = { readerPassword: '123456', adminPassword: 'admin' };
            state.booksSha = '';
            // 创建 books.json
            const sha = await saveWithRetry('books.json', { settings: state.settings, books: [] }, null, '初始化 books.json');
            state.booksSha = sha;
        } else {
            state.books = result.data.books || [];
            state.settings = result.data.settings || { readerPassword: '123456', adminPassword: 'admin' };
            state.booksSha = result.sha;
        }
    } catch (e) {
        toast('连接 GitHub 失败：' + e.message, true);
        return;
    }

    if (pwd !== state.settings.adminPassword) {
        return toast('管理员密码错误', true);
    }

    localStorage.setItem('novel_token', token);
    $('loginBox').style.display = 'none';
    $('mainArea').style.display = 'block';
    $('logoutBtn').style.display = 'inline-flex';
    refreshAll();
    toast('登录成功');
};

$('logoutBtn').onclick = function() {
    state.token = '';
    state.books = [];
    localStorage.removeItem('novel_token');
    $('loginBox').style.display = 'block';
    $('mainArea').style.display = 'none';
    $('logoutBtn').style.display = 'none';
    $('adminPwd').value = '';
    toast('已退出');
};

window.addEventListener('DOMContentLoaded', function() {
    const saved = localStorage.getItem('novel_token');
    if (saved) $('tokenInput').value = saved;
    const now = toLocalInput(new Date());
    $('nbCreateTime').value = now;
    $('ncPublishTime').value = now;
    $('biStartTime').value = now;
});

// ========== 数据读写 ==========
async function saveBooks() {
    try {
        const payload = { settings: state.settings, books: state.books };
        state.booksSha = await saveWithRetry('books.json', payload, state.booksSha, '更新书籍列表');
        return true;
    } catch (e) {
        toast('保存失败：' + e.message, true);
        return false;
    }
}

// 读取某本书的完整章节列表（跨所有 part）
async function loadAllChapters(book) {
    const metaPath = book.metaFile;
    if (!metaPath) return { chapters: [], parts: [] };

    let meta;
    try {
        const result = await ghGet(metaPath);
        if (!result) return { chapters: [], parts: [] };
        meta = result.data;
        state.shaCache[metaPath] = result.sha;
    } catch (e) {
        return { chapters: [], parts: [] };
    }

    // meta 结构：{ bookId, parts: [{file, start, end}], totalChapters }
    const parts = meta.parts || [];
    const allChapters = [];

    for (const part of parts) {
        try {
            const r = await ghGet(part.file);
            if (r) {
                state.shaCache[part.file] = r.sha;
                (r.data.chapters || []).forEach(ch => allChapters.push(ch));
            }
        } catch(e) { /* 跳过读不到的 part */ }
    }

    return { chapters: allChapters, parts, meta };
}

// 保存所有章节（自动分文件）
async function saveAllChapters(book, chapters) {
    const metaPath = book.metaFile;
    const baseName = book.metaFile.replace('_meta.json', '');
    const total = chapters.length;
    const partCount = Math.max(1, Math.ceil(total / CHAPTERS_PER_FILE));

    const parts = [];
    for (let i = 0; i < partCount; i++) {
        const start = i * CHAPTERS_PER_FILE;
        const end = Math.min(start + CHAPTERS_PER_FILE, total);
        const partChapters = chapters.slice(start, end);
        const fileName = `${baseName}_part${i + 1}.json`;

        try {
            const newSha = await saveWithRetry(
                fileName,
                { bookId: book.id, partIndex: i + 1, chapters: partChapters },
                state.shaCache[fileName] || null,
                `更新 ${book.title} 第${i+1}部分`
            );
            state.shaCache[fileName] = newSha;
            parts.push({ file: fileName, start, end: end - 1 });
        } catch (e) {
            toast('保存 part' + (i+1) + ' 失败：' + e.message, true);
            return false;
        }
    }

    // 更新 meta
    try {
        const newSha = await saveWithRetry(
            metaPath,
            { bookId: book.id, totalChapters: total, parts: parts },
            state.shaCache[metaPath] || null,
            `更新 ${book.title} 索引`
        );
        state.shaCache[metaPath] = newSha;
        return true;
    } catch (e) {
        toast('保存索引失败：' + e.message, true);
        return false;
    }
}

// ========== 标签切换 ==========
document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = function() {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        $('panel-' + tab.dataset.tab).classList.add('active');
        if (tab.dataset.tab === 'books') renderBookList();
        if (tab.dataset.tab === 'newChapter') renderBookSelects();
        if (tab.dataset.tab === 'chapters') { renderBookSelects(); renderChapterList(); }
        if (tab.dataset.tab === 'batch') renderBookSelects();
        if (tab.dataset.tab === 'settings') renderSettings();
    };
});

// ========== 渲染 ==========
let expandedBooks = {};

function renderBookList() {
    const box = $('bookList');
    if (state.books.length === 0) {
        box.innerHTML = '<div class="empty">暂无书籍</div>';
        return;
    }
    box.innerHTML = state.books.map((b, i) => {
        const isOpen = expandedBooks[b.id];
        return `
        <div class="item" style="flex-direction:column; align-items:stretch;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.6rem;">
                <div class="item-info" style="cursor:pointer;" onclick="toggleBook('${b.id}')">
                    <div class="item-title">${isOpen ? '▾' : '▸'} ${escapeHtml(b.title || '无题')}</div>
                    <div class="item-meta">${escapeHtml(b.category || '')} · ${escapeHtml(b.author || '未署名')} · 创建于 ${escapeHtml(b.createTime || '')}</div>
                </div>
                <div class="item-actions">
                    <button class="btn btn-small" onclick="toggleBook('${b.id}')">${isOpen ? '收起' : '展开'}</button>
                    <button class="btn btn-small btn-danger" onclick="deleteBook(${i})">删除</button><button class="btn btn-small" onclick="changeBookStatus(${i})">改状态</button><button class="btn btn-small" onclick="changeBookStatus(${i})">改状态</button>
<button class="btn btn-small btn-danger" onclick="deleteBook(${i})">删除</button>
                </div>
            </div>
            ${isOpen ? `<div id="book-chapters-${b.id}" style="margin-top:1rem; padding-top:1rem; border-top:1px dashed #e9dbce;"><div class="empty">加载中...</div></div>` : ''}
        </div>
        `;
    }).join('');

    state.books.forEach(b => { if (expandedBooks[b.id]) loadBookChaptersInline(b.id); });
}

window.toggleBook = function(bookId) {
    expandedBooks[bookId] = !expandedBooks[bookId];
    renderBookList();
};

async function loadBookChaptersInline(bookId) {
    const book = state.books.find(b => b.id === bookId);
    if (!book) return;
    const box = document.getElementById('book-chapters-' + bookId);
    if (!box) return;

    const { chapters } = await loadAllChapters(book);
    if (chapters.length === 0) {
        box.innerHTML = '<div class="empty">本书暂无章节</div>';
        return;
    }
    box.innerHTML = chapters.map((c, i) => {
        const isScheduled = c.isScheduled && new Date(c.publishTime) > new Date();
        const badge = isScheduled
            ? '<span class="badge badge-scheduled">定时中</span>'
            : '<span class="badge badge-live">已发布</span>';
        return `
            <div class="item" style="margin-bottom:0.5rem;">
                <div class="item-info">
                    <div class="item-title">${escapeHtml(c.title || '无题')} ${badge}</div>
                    <div class="item-meta">📅 ${escapeHtml(c.publishTime || '未设置')}</div>
                </div>
                <div class="item-actions">
                    <button class="btn btn-small" onclick="editChapterById('${book.id}', ${i})">编辑</button>
                    <button class="btn btn-small btn-danger" onclick="deleteChapterById('${book.id}', ${i})">删除</button>
                </div>
            </div>
        `;
    }).join('');
}

window.editChapterById = async function(bookId, index) {
    const book = state.books.find(b => b.id === bookId);
    if (!book) return;
    const { chapters } = await loadAllChapters(book);
    const ch = chapters[index];
    if (!ch) return;

    const newTitle = prompt('章节标题', ch.title || '');
    if (newTitle === null) return;
    const newContent = prompt('正文', ch.content || '');
    if (newContent === null) return;
    const newTime = prompt('发表时间（2023-05-12 10:00）', ch.publishTime || '');
    if (newTime === null) return;

    ch.title = newTitle;
    ch.content = newContent;
    ch.publishTime = newTime;

    if (await saveAllChapters(book, chapters)) {
        toast('已保存');
        renderBookList();
    }
};

window.deleteChapterById = async function(bookId, index) {
    const book = state.books.find(b => b.id === bookId);
    if (!book) return;
    if (!confirm('确定删除这一章吗？')) return;
    const { chapters } = await loadAllChapters(book);
    chapters.splice(index, 1);
    if (await saveAllChapters(book, chapters)) {
        toast('已删除');
        renderBookList();
    }
};

async function renderChapterList() {
    const box = $('chapterList');
    const bookId = $('cmBookSelect').value;
    const book = state.books.find(b => b.id === bookId);
    if (!book) {
        box.innerHTML = '<div class="empty">请选择一本书</div>';
        return;
    }
    const { chapters } = await loadAllChapters(book);
    if (chapters.length === 0) {
        box.innerHTML = '<div class="empty">这本书还没有章节</div>';
        return;
    }
    box.innerHTML = chapters.map((c, i) => {
        const isScheduled = c.isScheduled && new Date(c.publishTime) > new Date();
        const badge = isScheduled ? '<span class="badge badge-scheduled">定时中</span>' : '<span class="badge badge-live">已发布</span>';
        return `
            <div class="item">
                <div class="item-info">
                    <div class="item-title">${escapeHtml(c.title || '无题')} ${badge}</div>
                    <div class="item-meta">发表时间：${escapeHtml(c.publishTime || '未设置')}</div>
                </div>
                <div class="item-actions">
                    <button class="btn btn-small" onclick="editChapter(${i})">编辑</button>
                    <button class="btn btn-small" onclick="moveChapter(${i}, -1)">↑</button>
                    <button class="btn btn-small" onclick="moveChapter(${i}, 1)">↓</button>
                    <button class="btn btn-small btn-danger" onclick="deleteChapter(${i})">删除</button>
                </div>
            </div>
        `;
    }).join('');
}

function renderBookSelects() {
    ['ncBookSelect', 'cmBookSelect', 'biBookSelect'].forEach(id => {
        const input = document.getElementById(id);
        const label = document.getElementById(id + 'Label');
        if (!input || !label) return;
        if (input.value) {
            const book = state.books.find(b => b.id === input.value);
            label.textContent = book ? book.title : '点击选择书籍';
            if (!book) input.value = '';
        } else {
            label.textContent = '点击选择书籍';
        }
    });
}

function renderSettings() {
    $('stReaderPwd').value = state.settings.readerPassword || '';
    $('stAdminPwd').value = state.settings.adminPassword || '';
}

// ========== 选择弹窗 ==========
let currentPickerTarget = null;

window.openPicker = function(targetId) {
    currentPickerTarget = targetId;
    const overlay = document.getElementById('pickerOverlay');
    const optionsBox = document.getElementById('pickerOptions');

    if (state.books.length === 0) {
        optionsBox.innerHTML = '<div class="empty">还没有书</div>';
    } else {
        const currentVal = document.getElementById(targetId).value;
        optionsBox.innerHTML = state.books.map(b => `
            <div class="picker-option ${b.id === currentVal ? 'selected' : ''}" onclick="pickOption('${b.id}', '${escapeHtml(b.title)}')">
                ${escapeHtml(b.title)}
            </div>
        `).join('');
    }
    overlay.classList.add('open');
};

window.pickOption = function(value, label) {
    document.getElementById(currentPickerTarget).value = value;
    document.getElementById(currentPickerTarget + 'Label').textContent = label;
    if (currentPickerTarget === 'cmBookSelect') renderChapterList();
    closePicker();
};

window.closePicker = function() {
    document.getElementById('pickerOverlay').classList.remove('open');
    currentPickerTarget = null;
};

window.closePickerOutside = function(e) {
    if (e.target.id === 'pickerOverlay') closePicker();
};

window.pickCategory = function(value) {
    document.querySelectorAll('#nbCategoryGroup .cat-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.value === value);
    });
};

window.pickStatus = function(value) {
    document.querySelectorAll('#nbStatusGroup .cat-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.value === value);
    });
};
    
window.pickType = function(value) {
    document.querySelectorAll('#ncTypeGroup .cat-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.value === value);
    });
};

function getSelectedType() {
    const btn = document.querySelector('#ncTypeGroup .cat-btn.selected');
    return btn ? btn.dataset.value : 'main';
}
function getSelectedCategory() {
    const btn = document.querySelector('#nbCategoryGroup .cat-btn.selected');
    return btn ? btn.dataset.value : 'BL';
}

function getSelectedStatus() {
    const btn = document.querySelector('#nbStatusGroup .cat-btn.selected');
    return btn ? btn.dataset.value : '连载中';
}

// ========== 创建书籍 ==========
$('createBookBtn').onclick = async function() {
    const title = $('nbTitle').value.trim();
    if (!title) return toast('请填写书名', true);

    const createTime = $('nbCreateTime').value
        ? $('nbCreateTime').value.replace('T', ' ')
        : new Date().toISOString().slice(0, 16).replace('T', ' ');

    const bookId = uid('b');
    const metaFile = 'book_' + bookId + '_meta.json';

    const book = {
        id: bookId,
        title: title,
        author: $('nbAuthor').value.trim(),
        category: getSelectedCategory(),
        status: getSelectedStatus(),
        description: $('nbDesc').value.trim(),
        createTime: createTime,
        metaFile: metaFile
    };

    // 先创建空的 meta 文件
    try {
        const sha = await saveWithRetry(metaFile, { bookId, totalChapters: 0, parts: [] }, null, '创建 ' + title);
        state.shaCache[metaFile] = sha;
    } catch (e) {
        toast('创建索引失败：' + e.message, true);
        return;
    }

    state.books.push(book);
    if (!(await saveBooks())) {
        state.books.pop();
        return;
    }

    toast('创建成功');
    $('nbTitle').value = '';
    $('nbAuthor').value = '';
    $('nbDesc').value = '';
    pickCategory('BL');
    pickStatus('连载中');
    renderBookList();
    renderBookSelects();
};

// ========== 创建章节 ==========
$('createChapterBtn').onclick = async function() {
    const bookId = $('ncBookSelect').value;
    if (!bookId) return toast('请选择书籍', true);
    const title = $('ncTitle').value.trim();
    if (!title) return toast('请填写章节标题', true);

    const book = state.books.find(b => b.id === bookId);
    if (!book) return toast('书籍不存在', true);

    const { chapters } = await loadAllChapters(book);
    const publishTime = $('ncPublishTime').value
        ? $('ncPublishTime').value.replace('T', ' ')
        : new Date().toISOString().slice(0, 16).replace('T', ' ');

    chapters.push({
        id: uid('ch'),
        title: title,
        content: $('ncContent').value,
        publishTime: publishTime,
isScheduled: $('ncScheduled').value === 'true',
        type: getSelectedType()
    });

    if (await saveAllChapters(book, chapters)) {
        toast('添加成功');
        $('ncTitle').value = '';
        $('ncTitle').value = '';
        $('ncContent').value = '';
    }
};

// ========== 删除书籍 ==========
    window.changeBookStatus = async function(index) {
    const book = state.books[index];
    if (!book) return;
    const current = book.status || '连载中';
    const newStatus = current === '已完结' ? '连载中' : '已完结';
    if (!confirm(`把《${book.title}》改为「${newStatus}」？`)) return;
    book.status = newStatus;
    if (await saveBooks()) {
        toast('状态已改为：' + newStatus);
        renderBookList();
    }
};
window.deleteBook = async function(index) {
    if (!confirm('确定从书单删除这本书吗？（章节数据文件不会自动删）')) return;
    const removed = state.books[index];
    state.books = state.books.filter((_, i) => i !== index);
    if (await saveBooks()) {
        toast('已移除');
        renderBookList();
        renderBookSelects();
    } else {
        state.books = [...state.books.slice(0, index), removed, ...state.books.slice(index)];
    }
};

// ========== 章节操作 ==========
window.editChapter = async function(index) {
    const book = state.books.find(b => b.id === $('cmBookSelect').value);
    if (!book) return;
    const { chapters } = await loadAllChapters(book);
    const ch = chapters[index];
    if (!ch) return;

    const newTitle = prompt('章节标题', ch.title || '');
    if (newTitle === null) return;
    const newContent = prompt('正文', ch.content || '');
    if (newContent === null) return;
    const newTime = prompt('发表时间', ch.publishTime || '');
    if (newTime === null) return;

    ch.title = newTitle;
    ch.content = newContent;
    ch.publishTime = newTime;

    if (await saveAllChapters(book, chapters)) {
        toast('已保存');
        renderChapterList();
    }
};

window.moveChapter = async function(index, dir) {
    const book = state.books.find(b => b.id === $('cmBookSelect').value);
    if (!book) return;
    const { chapters } = await loadAllChapters(book);
    const ni = index + dir;
    if (ni < 0 || ni >= chapters.length) return;
    [chapters[index], chapters[ni]] = [chapters[ni], chapters[index]];
    if (await saveAllChapters(book, chapters)) renderChapterList();
};

window.deleteChapter = async function(index) {
    const book = state.books.find(b => b.id === $('cmBookSelect').value);
    if (!book) return;
    if (!confirm('确定删除这一章吗？')) return;
    const { chapters } = await loadAllChapters(book);
    chapters.splice(index, 1);
    if (await saveAllChapters(book, chapters)) {
        toast('已删除');
        renderChapterList();
    }
};

// ========== 工具栏 ==========
document.querySelectorAll('.toolbar button').forEach(btn => {
    btn.onclick = function() {
        const ta = $('ncContent');
        const action = btn.dataset.action;
        let text = ta.value;
        if (action === 'indent') {
            text = text.split('\n').map(line => {
                if (line.trim() === '') return line;
                return line.replace(/^[\s\u3000]*/, '　　');
            }).join('\n');
        } else if (action === 'blank') {
            text = text.split('\n').filter(l => l.trim() !== '').join('\n\n');
        } else if (action === 'trim') {
            text = text.split('\n').map(l => l.trim()).join('\n');
            text = text.replace(/\n{3,}/g, '\n\n');
        } else if (action === 'auto') {
            text = text.split('\n').map(l => l.trim()).filter(l => l !== '').join('\n\n');
            text = text.split('\n').map(line => {
                if (line.trim() === '') return line;
                return line.replace(/^[\s\u3000]*/, '　　');
            }).join('\n');
        }
        ta.value = text;
    };
});

// ========== 保存设置 ==========
$('saveSettingsBtn').onclick = async function() {
    state.settings.readerPassword = $('stReaderPwd').value.trim() || 'read';
    state.settings.adminPassword = $('stAdminPwd').value.trim() || 'admin';
    if (await saveBooks()) toast('设置已保存');
};

// ========== 批量导入 ==========
$('batchImportBtn').onclick = async function() {
    const bookId = $('biBookSelect').value;
    if (!bookId) return toast('请选择书籍', true);
    const book = state.books.find(b => b.id === bookId);
    if (!book) return toast('书籍不存在', true);

    const raw = $('biContent').value;
    if (!raw.trim()) return toast('请粘贴内容', true);

    const interval = parseInt($('biInterval').value) || 0;
    const startTimeStr = $('biStartTime').value;
    const startTime = startTimeStr ? new Date(startTimeStr) : new Date();

    const lines = raw.split('\n');
    const newChapters = [];
    let current = null;
    const chapterRegex = /^\s*第\s*[0-9一二三四五六七八九十百千]+\s*[章节回]/;

    for (const line of lines) {
        if (chapterRegex.test(line)) {
            if (current) newChapters.push(current);
            current = { title: line.trim(), content: '' };
        } else if (current) {
            current.content += (current.content ? '\n' : '') + line;
        }
    }
    if (current) newChapters.push(current);

    if (newChapters.length === 0) return toast('没有识别到章节', true);

    const { chapters: oldChapters } = await loadAllChapters(book);
    const baseIndex = oldChapters.length;

    for (let i = 0; i < newChapters.length; i++) {
        const t = new Date(startTime.getTime() + i * interval * 60000);
        const timeStr = t.toISOString().slice(0, 16).replace('T', ' ');
        oldChapters.push({
            id: uid('ch'),
            title: newChapters[i].title,
            content: newChapters[i].content.trim(),
            publishTime: timeStr,
            isScheduled: t > new Date()
        });
    }

    if (await saveAllChapters(book, oldChapters)) {
        toast('成功导入 ' + newChapters.length + ' 章');
        $('biContent').value = '';
    }
};

// ========== 刷新 ==========
function refreshAll() {
    renderBookList();
    renderBookSelects();
    renderSettings();
}
