<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读 · 我的书房</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Georgia','宋体',serif; }
body { min-height: 100vh; color: #2f241b; padding: 1.5rem; transition: background 0.3s; }
body.bg-paper { background: #f7f3eb; }
body.bg-white { background: #ffffff; }
body.bg-green { background: #e8efe3; }
body.bg-dark  { background: #2b2b2b; color: #d8d8d8; }
.container { max-width: 1100px; margin: 0 auto; }

.gate { position: fixed; inset: 0; z-index: 9999; background: #f7f3eb; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.gate-box { max-width: 400px; width: 100%; background: #fefcf9; border: 1px solid #e9dbce; border-radius: 1.5rem; padding: 2rem; text-align: center; }
.gate-box .icon { font-size: 3rem; margin-bottom: 1rem; }
.gate-box h2 { font-weight: 400; color: #3f2e22; letter-spacing: 2px; margin-bottom: 0.5rem; }
.gate-box p { color: #8b7a6b; font-size: 0.9rem; font-style: italic; margin-bottom: 1.5rem; }
.gate-box input { width: 100%; padding: 0.9rem 1rem; border: 1px solid #d6c7b8; border-radius: 60px; font-size: 1rem; background: #fffcf9; outline: none; text-align: center; letter-spacing: 2px; color: #2f241b; margin-bottom: 1rem; font-family: inherit; }
.gate-box button { width: 100%; padding: 0.9rem 0; background: #5e4b3c; color: #fff; border: none; border-radius: 60px; font-size: 1rem; letter-spacing: 2px; cursor: pointer; font-family: inherit; }
.gate-error { color: #b35e5e; font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2rem; font-style: italic; }

.top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; margin-bottom: 1.5rem; border-bottom: 2px solid #e0d3c6; flex-wrap: wrap; gap: 0.8rem; }
.back-btn { background: #efe6dd; color: #5e4b3c; border: none; padding: 0.6rem 1.2rem; border-radius: 40px; cursor: pointer; font-size: 0.9rem; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
.book-title-top { font-size: 1.4rem; color: #3f2e22; font-weight: 400; letter-spacing: 2px; }

.read-tools { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; background: #fefcf9; border: 1px solid #e9dbce; border-radius: 1rem; padding: 0.7rem 1rem; margin-bottom: 1.2rem; }
.read-tools .label { font-size: 0.85rem; color: #8b7a6b; }
.read-tools button { background: #efe6dd; border: 1px solid #d6c7b8; color: #5e4b3c; padding: 0.35rem 0.8rem; border-radius: 40px; cursor: pointer; font-size: 0.85rem; font-family: inherit; }
.read-tools button.active { background: #5e4b3c; color: #fff; }

.read-layout { display: grid; grid-template-columns: 240px 1fr; gap: 2rem; }
@media (max-width: 800px) {
    .read-layout { grid-template-columns: 1fr; gap: 1rem; }
    .chapter-list { display: none; position: fixed; inset: 0; max-height: 100vh; border-radius: 0; z-index: 1000; padding: 1.5rem 1rem; overflow-y: auto; }
    .chapter-list.open { display: block; }
    .chapter-close { display: block; text-align: right; font-size: 1.5rem; color: #8b7a6b; padding: 0.5rem; cursor: pointer; border: none; background: transparent; width: 100%; }
    .chapter-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 999; }
    .chapter-overlay.open { display: block; }
}
.chapter-close { display: none; }

.chapter-list { background: #fefcf9; border: 1px solid #e9dbce; border-radius: 1rem; padding: 1rem; max-height: 80vh; overflow-y: auto; align-self: start; position: sticky; top: 1.5rem; }
.chapter-list h3 { font-size: 1rem; color: #8b7a6b; font-weight: 400; margin-bottom: 0.8rem; padding-left: 0.5rem; }
.chapter-item { padding: 0.7rem 0.9rem; border-radius: 0.6rem; cursor: pointer; color: #5a4a3e; font-size: 0.95rem; margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapter-item:hover { background: #f3ece3; }
.chapter-item.active { background: #5e4b3c; color: #fff; }

.menu-btn { display: none; background: #5e4b3c; color: #fff; border: none; padding: 0.6rem 1.1rem; border-radius: 40px; cursor: pointer; font-size: 0.9rem; font-family: inherit; }
@media (max-width: 800px) { .menu-btn { display: inline-flex; align-items: center; gap: 0.4rem; } }

.article-area { background: #fefcf9; border: 1px solid #e9dbce; border-radius: 1rem; padding: 2.5rem 3rem; }
body.bg-dark .article-area { background: #3a3a3a; border-color: #444; }
body.bg-dark .article-title { color: #e8e8e8; }
body.bg-white .article-area { background: #fff; }
body.bg-green .article-area { background: #f4f9ef; }
@media (max-width: 600px) { .article-area { padding: 1.5rem 1.2rem; } }

.article-title { font-size: 1.8rem; color: #3f2e22; font-weight: 400; margin-bottom: 0.5rem; letter-spacing: 1px; border-left: 5px solid #b09b89; padding-left: 1rem; }
.article-meta { color: #9b8a7a; font-size: 0.9rem; font-style: italic; margin-bottom: 2rem; padding-left: 1.3rem; }
.article-content { line-height: 2; }
.article-content p { text-indent: 2em; margin-bottom: 1.2rem; }

.nav-buttons { display: flex; justify-content: space-between; margin-top: 3rem; padding-top: 1.5rem; border-top: 1px dashed #e9dbce; gap: 1rem; flex-wrap: wrap; }
.nav-btn { background: #efe6dd; color: #5e4b3c; border: none; padding: 0.7rem 1.4rem; border-radius: 40px; cursor: pointer; font-size: 0.95rem; font-family: inherit; }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.loading-tip { text-align: center; padding: 4rem 1rem; color: #b7a89b; font-style: italic; }
</style>
</head>
<body class="bg-paper">

<div id="gate" class="gate">
    <div class="gate-box">
        <div class="icon">🔒</div>
        <h2>私人书房</h2>
        <p>请输入阅读密码</p>
        <input type="password" id="gatePwd" placeholder="········" autocomplete="off">
        <button id="gateBtn">进入书房</button>
        <div id="gateError" class="gate-error"></div>
        <div style="font-size:0.8rem; color:#b7a89b; margin-top:1.2rem; font-style:italic;">
            密码获取添加 QQ：1550930440
        </div>
    </div>
</div>

<div class="container" id="mainContent" style="display:none;">
    <div class="top-bar">
        <a href="index.html" class="back-btn">← 返回书架</a>
        <button class="menu-btn" onclick="toggleMenu()">📖 目录</button>
        <div class="book-title-top" id="topTitle">加载中...</div>
    </div>

    <div class="read-tools">
        <span class="label">字体：</span>
        <button onclick="setFontSize(-1)">A-</button>
        <button onclick="setFontSize(1)">A+</button>
        <span class="label" style="margin-left:1rem;">背景：</span>
        <button class="bg-btn active" data-bg="paper" onclick="setBg('paper')">📜 纸张</button>
        <button class="bg-btn" data-bg="white" onclick="setBg('white')">⚪ 白纸</button>
        <button class="bg-btn" data-bg="green" onclick="setBg('green')">🌿 护眼</button>
        <button class="bg-btn" data-bg="dark" onclick="setBg('dark')">🌙 暗黑</button>
    </div>

    <div class="read-layout">
        <aside class="chapter-list" id="chapterListBox">
            <button class="chapter-close" onclick="closeMenu()">✕ 关闭</button>
            <h3>📖 章节目录</h3>
            <div id="chapterList"><div class="loading-tip">加载中...</div></div>
        </aside>
        <main class="article-area" id="articleArea">
            <div class="loading-tip">正在加载正文...</div>
        </main>
    </div>
</div>

<div class="chapter-overlay" id="chapterOverlay" onclick="closeMenu()"></div>

<script>
// ============================================================
// 新结构阅读页：读 _meta.json + 单章文件
// ============================================================

const REPO = 'Rongr96/novel';

let READER_PASSWORD = "123456";
const PASS_KEY = "novel_pass_ok";
const PASS_TTL = 24 * 60 * 60 * 1000;
const HISTORY_KEY = "novel_read_history";
const FONT_KEY = "novel_font_size";
const BG_KEY = "novel_bg";

function hasPass() {
    try {
        const raw = localStorage.getItem(PASS_KEY);
        if (!raw) return false;
        const obj = JSON.parse(raw);
        if (Date.now() - obj.t > PASS_TTL) return false;
        return true;
    } catch(e) { return false; }
}
function setPass() { localStorage.setItem(PASS_KEY, JSON.stringify({ t: Date.now() })); }
function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}'); } catch(e) { return {}; } }
function saveHistory(bookId, chapterIndex, bookTitle) {
    const h = getHistory();
    h[bookId] = { bookId, chapterIndex, bookTitle, t: Date.now() };
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
}
function getFontSize() { return parseInt(localStorage.getItem(FONT_KEY)) || 17; }
function setFontSize(delta) {
    let size = getFontSize() + delta * 2;
    if (size < 12) size = 12;
    if (size > 32) size = 32;
    localStorage.setItem(FONT_KEY, size);
    const content = document.querySelector('.article-content');
    if (content) content.style.fontSize = size + 'px';
}
function setBg(bg) {
    document.body.className = 'bg-' + bg;
    localStorage.setItem(BG_KEY, bg);
    document.querySelectorAll('.bg-btn').forEach(b => b.classList.toggle('active', b.dataset.bg === bg));
}
function applyBg() {
    const bg = localStorage.getItem(BG_KEY) || 'paper';
    document.body.className = 'bg-' + bg;
    document.querySelectorAll('.bg-btn').forEach(b => b.classList.toggle('active', b.dataset.bg === bg));
}

let currentBook = null;
let allChapters = [];  // 章节索引（不含正文）
let chapterContentCache = {};  // 缓存已加载的正文
let currentChapterIndex = 0;

window.addEventListener('DOMContentLoaded', async function() {
    applyBg();
    try {
        const res = await fetch('books.json?t=' + Date.now());
        if (res.ok) {
            const data = await res.json();
            if (data.settings && data.settings.readerPassword) READER_PASSWORD = data.settings.readerPassword;
        }
    } catch(e) {}
    if (hasPass()) showContent();
    else document.getElementById('gatePwd').focus();
});

document.getElementById('gateBtn').onclick = function() {
    const pwd = document.getElementById('gatePwd').value.trim();
    if (pwd === READER_PASSWORD) { setPass(); showContent(); }
    else {
        document.getElementById('gateError').textContent = '密码不正确，请重试。';
        document.getElementById('gatePwd').value = '';
        document.getElementById('gatePwd').focus();
    }
};
document.getElementById('gatePwd').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('gateBtn').click(); }
});

function showContent() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    init();
}

async function init() {
    const params = new URLSearchParams(window.location.search);
    const bookId = params.get('book');
    const jumpChapter = parseInt(params.get('ch'));

    if (!bookId) {
        document.getElementById('articleArea').innerHTML = '<div class="loading-tip">没有指定书籍</div>';
        return;
    }

    let booksData;
    try {
        const res = await fetch('books.json?t=' + Date.now());
        if (!res.ok) throw new Error();
        booksData = await res.json();
    } catch (err) {
        document.getElementById('articleArea').innerHTML = '<div class="loading-tip">读取书籍列表失败</div>';
        return;
    }

    currentBook = (booksData.books || []).find(b => b.id === bookId);
    if (!currentBook) {
        document.getElementById('articleArea').innerHTML = '<div class="loading-tip">找不到这本书</div>';
        return;
    }

    // 只读 meta（索引），非常快
    allChapters = [];
    if (currentBook.metaFile) {
        try {
            const metaRes = await fetch(currentBook.metaFile + '?t=' + Date.now());
            if (metaRes.ok) {
                const meta = await metaRes.json();
                allChapters = meta.chapters || [];
            }
        } catch(e) {}
    }

    document.getElementById('topTitle').textContent = currentBook.title || '未命名';
    document.title = (currentBook.title || '阅读') + ' · 我的书房';
    renderChapterList();

    const startCh = (!isNaN(jumpChapter) && jumpChapter >= 0) ? jumpChapter : 0;
    loadChapter(startCh);
}

function getVisibleChapters() {
    const now = new Date();
    return allChapters.filter(ch => {
        if (!ch.isScheduled) return true;
        return new Date(ch.publishTime) <= now;
    });
}

function renderChapterList() {
    const list = document.getElementById('chapterList');
    const chapters = getVisibleChapters();
    if (chapters.length === 0) {
        list.innerHTML = '<div class="loading-tip">本书暂无章节</div>';
        return;
    }

    const mainChapters = [];
    const extraChapters = [];
    chapters.forEach((ch, i) => {
        const item = { ...ch, _index: i };
        if (ch.type === 'extra') extraChapters.push(item);
        else mainChapters.push(item);
    });

    let html = '';
    if (mainChapters.length > 0) {
        html += '<div style="font-size:0.85rem;color:#8b7a6b;padding:0.5rem 0.7rem;letter-spacing:1px;">📖 正文</div>';
        html += mainChapters.map(ch => `
            <div class="chapter-item" data-index="${ch._index}" onclick="loadChapter(${ch._index}); closeMenu();">
                ${escapeHtml(ch.title || ('第' + (ch._index+1) + '章'))}
            </div>
        `).join('');
    }
    if (extraChapters.length > 0) {
        html += '<div style="font-size:0.85rem;color:#8b7a6b;padding:0.8rem 0.7rem 0.5rem;letter-spacing:1px;border-top:1px dashed #e9dbce;margin-top:0.5rem;">📖 番外</div>';
        html += extraChapters.map(ch => `
            <div class="chapter-item" data-index="${ch._index}" onclick="loadChapter(${ch._index}); closeMenu();">
                ${escapeHtml(ch.title || ('第' + (ch._index+1) + '章'))}
            </div>
        `).join('');
    }
    list.innerHTML = html;
}

async function loadChapter(index) {
    const chapters = getVisibleChapters();
    if (index < 0 || index >= chapters.length) return;
    currentChapterIndex = index;
    const ch = chapters[index];

    document.querySelectorAll('.chapter-item').forEach((el, i) => {
        el.classList.toggle('active', parseInt(el.dataset.index) === index);
    });

    // 显示加载状态
    const articleArea = document.getElementById('articleArea');
    articleArea.innerHTML = '<div class="loading-tip">📖 正在加载...</div>';

    // 读正文
    let content = chapterContentCache[ch.id];
    if (content === undefined) {
        try {
            if (ch.file) {
                const r = await fetch(ch.file + '?t=' + Date.now());
                if (r.ok) {
                    const d = await r.json();
                    content = d.content || '';
                } else {
                    content = '';
                }
            } else if (ch.content) {
                content = ch.content;
            } else {
                content = '';
            }
            chapterContentCache[ch.id] = content;
        } catch(e) {
            content = '';
        }
    }

    const paras = (content || '').split('\n')
        .filter(p => p.trim() !== '')
        .map(p => `<p>${escapeHtml(p)}</p>`).join('');

    const fontSize = getFontSize();
    articleArea.innerHTML = `
        <h1 class="article-title">${escapeHtml(ch.title || ('第' + (index+1) + '章'))}</h1>
        <div class="article-meta">📅 ${escapeHtml(ch.publishTime || '')}　✍️ ${escapeHtml(currentBook.author || '未署名')}</div>
        <div class="article-content" style="font-size:${fontSize}px;">
            ${paras || '<p style="text-indent:0;color:#b7a89b;font-style:italic;">（本章暂无正文）</p>'}
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="loadChapter(${index-1})" ${index <= 0 ? 'disabled' : ''}>← 上一章</button>
            <button class="nav-btn" onclick="loadChapter(${index+1})" ${index >= chapters.length-1 ? 'disabled' : ''}>下一章 →</button>
        </div>
    `;

    saveHistory(currentBook.id, index, currentBook.title);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleMenu() {
    document.getElementById('chapterListBox').classList.toggle('open');
    document.getElementById('chapterOverlay').classList.toggle('open');
}
function closeMenu() {
    document.getElementById('chapterListBox').classList.remove('open');
    document.getElementById('chapterOverlay').classList.remove('open');
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
}
</script>
</body>
</html>
